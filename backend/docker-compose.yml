# Nombre fijo: si no, Compose lo toma de la carpeta y al renombrarla
# crearía volúmenes nuevos (vacíos) en vez de reusar los de siempre.
name: telar

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: telar
      POSTGRES_PASSWORD: telar
      POSTGRES_DB: telar
    volumes:
      - telar_db:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telar"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://telar:telar@db:5432/telar
      MEDIA_STORAGE_DIR: /app/data/media
    volumes:
      - telar_media:/app/data/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Opcional: expone el webhook por HTTPS sin abrir puertos ni tener IP fija.
  # Sirve tanto para desarrollo como para producción -- ver README, sección
  # de despliegue. Se activa aparte (perfil "tunnel") porque exige tener ya
  # un túnel creado en el dashboard de Cloudflare con su token.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    profiles: ["tunnel"]

volumes:
  telar_db:
  telar_media:
