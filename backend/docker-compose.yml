# Nombre fijo: si no, Compose lo toma de la carpeta y al renombrarla
# crearía volúmenes nuevos (vacíos) en vez de reusar los de siempre.
name: telar

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: telar
      POSTGRES_PASSWORD: telar
      POSTGRES_DB: telar
    volumes:
      - telar_db:/var/lib/postgresql/data
    # Solo desde esta máquina: publicarlo en 0.0.0.0 lo deja abierto a
    # internet (Docker se salta el firewall del host).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telar"]
      interval: 5s
      retries: 10

  # Aplica las migraciones pendientes y termina; la API arranca después.
  migrate:
    build: .
    image: telar-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://telar:telar@db:5432/telar
    command: ["python", "-m", "telar.db.migrate"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    image: telar-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://telar:telar@db:5432/telar
      MEDIA_STORAGE_DIR: /app/data/media
    volumes:
      - telar_media:/app/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"

  # Opcional: expone el webhook por HTTPS sin abrir puertos ni tener IP fija.
  # Sirve tanto para desarrollo como para producción -- ver README, sección
  # de despliegue. Se activa aparte (perfil "tunnel") porque exige tener ya
  # un túnel creado en el dashboard de Cloudflare con su token.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    profiles: ["tunnel"]

volumes:
  telar_db:
  telar_media:
