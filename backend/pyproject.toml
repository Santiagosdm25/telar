[project]
name = "telar"
version = "0.1.0"
description = "Plataforma open source de agentes conversacionales para WhatsApp Cloud API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "cryptography>=43",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-anthropic>=0.3",
    "langchain-text-splitters>=0.3",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2"]
ollama = ["langchain-ollama>=0.2"]
mysql = ["pymysql>=1.1"]  # solo si una cuenta conecta MySQL en Configuración -> Base de datos
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Loop compartido para toda la sesión: los tests de integración
# (tests/integration/) usan singletons de proceso (checkpointer, pool) que
# guardan primitivas de asyncio -- con un loop nuevo por test (el
# default), esas primitivas quedan atadas al loop del primer test y
# rompen en el segundo ("bound to a different event loop"). No afecta a
# los tests existentes: ninguno usa async def directo, todos manejan su
# propio asyncio.run() aislado (test_compiler.py) o son lógica pura sin
# asyncio (el resto).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: necesita Postgres real (tests/integration/) -- excluidos por defecto, ver addopts.",
]
# `pytest -q` sigue siendo rápido y sin depender de Postgres por default.
# Para los de integración: `pytest -m integration` (dentro del contenedor
# `api` en Windows -- ver tests/integration/conftest.py).
addopts = "-m 'not integration'"
